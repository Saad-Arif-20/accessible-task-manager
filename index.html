<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessible Task Manager | Portfolio Project</title>
    <meta name="description"
        content="A fully accessible, WCAG 2.1 compliant task management application demonstrating inclusive design principles.">

    <!-- CSS -->
    <link rel="stylesheet" href="src/css/variables.css">
    <link rel="stylesheet" href="src/css/main.css">
    <link rel="stylesheet" href="src/css/components.css">
</head>

<body>
    <!-- Skip Link for Keyboard Users -->
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <header role="banner" class="app-header">
        <div class="container">
            <h1 id="app-title">TaskMaster A11y</h1>

            <div class="controls">
                <button id="theme-toggle" aria-pressed="false" class="btn btn-icon">
                    <span class="btn-text">Switch to High Contrast</span>
                    <span class="icon" aria-hidden="true">🌗</span>
                </button>
            </div>
        </div>
    </header>

    <main id="main-content" role="main" class="container">
        <!-- Task Input Section -->
        <section aria-labelledby="add-task-heading" class="task-input-section">
            <h2 id="add-task-heading">Add New Task</h2>

            <form id="add-task-form" class="task-form">
                <div class="form-group">
                    <label for="new-task-title" class="form-label">Task Title (Required)</label>
                    <input type="text" id="new-task-title" name="title" required aria-required="true"
                        autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="new-task-desc" class="form-label">Description (Optional)</label>
                    <textarea id="new-task-desc" name="description" rows="2"></textarea>
                </div>

                <div class="form-group row">
                    <div class="col">
                        <label for="new-task-priority" class="form-label">Priority</label>
                        <select id="new-task-priority" name="priority">
                            <option value="low">Low Priority</option>
                            <option value="medium" selected>Medium Priority</option>
                            <option value="high">High Priority</option>
                        </select>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Add Task</button>
                </div>
            </form>
        </section>

        <!-- Task List Section -->
        <section aria-labelledby="task-list-heading" class="task-list-section">
            <div class="list-header">
                <h2 id="task-list-heading">My Tasks</h2>
                <div class="live-status" role="status" aria-live="polite" id="task-status">
                    0 tasks remaining
                </div>
            </div>

            <!-- Task List Container -->
            <ul id="task-list" class="task-list" aria-label="List of tasks">
                <!-- Tasks will be injected here via JS -->
            </ul>
        </section>
    </main>

    <footer role="contentinfo" class="app-footer">
        <div class="container">
            <p>&copy; 2026 Saad Arif. Built with Accessibility First.</p>
        </div>
    </footer>

    <!-- JavaScript (Module) -->
    <script type="module" src="src/js/app.js"></script>
</body>

</html>
